name: GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    name: Build and publish verified release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MPLBACKEND: Agg
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag and notes
        id: release
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version v{version}")
          notes = Path("markdown") / f"RELEASE_{tag}.md"
          if not notes.is_file() or not notes.read_text(encoding="utf-8").strip():
              raise SystemExit(f"Missing release notes: {notes}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nnotes={notes.as_posix()}\n")
      - name: Build distribution archives
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build 2>&1 | tee build.log
      - name: Verify archive contents and write checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          subprocess.run([sys.executable, "tests/check_distribution.py", str(wheel), str(sdist)], check=True)
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
                   for path in sorted((wheel, sdist))]
          Path("dist/SHA256SUMS").write_text("".join(lines), encoding="utf-8")
      - name: Verify the release wheel with base dependencies
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd().resolve()
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve()
          logs = root / "release-checks"
          logs.mkdir(exist_ok=True)
          wheel, = (root / "dist").glob("*.whl")
          commands = [
              ("install.log", [sys.executable, "-m", "pip", "install", str(wheel)]),
              ("core.log", [sys.executable, "-I", str(root / "tests/wheel_smoke.py"),
                            str(temporary / "topokit-release-core"),
                            str(root / "examples/data/point_cloud_24.csv")]),
              ("protein-ligand.log", [sys.executable, "-I", str(root / "tests/protein_ligand_wheel_smoke.py"),
                                      str(root / "examples/protein_ligand/manifest.csv")]),
          ]
          for name, command in commands:
              result = subprocess.run(command, cwd=temporary, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (logs / name).write_text(result.stdout, encoding="utf-8")
              print(result.stdout)
              result.check_returncode()
      - name: Create GitHub release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; existing releases and assets are left unchanged."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "TopoKit $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
      - name: Preserve release artifacts and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            build.log
            release-checks/
          if-no-files-found: ignore
          retention-days: 30
