[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topokit"
version = "0.3.0"
description = "Six-layer topology toolkit: readers, builders, core, postprocessing, visualization, workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Dong Chen"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/ChenDdon/TopoKit"
Repository = "https://github.com/ChenDdon/TopoKit"
Issues = "https://github.com/ChenDdon/TopoKit/issues"
Releases = "https://github.com/ChenDdon/TopoKit/releases"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]
ml = ["scikit-learn>=1.2"]
dl = ["torch>=2.6", "scikit-learn>=1.2"]
sequence = ["torch>=2.6", "transformers==4.57.6", "rdkit>=2025.9.1", "scikit-learn>=1.2"]
alpha_exact = ["gudhi>=3.11"]

[project.scripts]
topokit = "topokit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"topokit.workflows.protein_ligand_prediction" = ["reference_schema.json", "model_profile.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "workflows/protein_ligand_prediction/ml/tests", "workflows/protein_ligand_prediction_version2/tests", "workflows/protein_ligand_persistent_homology/tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
